name: CI - Biblioteca Pessoal

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build application
        run: ./mvnw -B -ntp clean package -DskipTests

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      # No CI: roda testes VCR + unitários (sem Docker/Testcontainers)
      - name: Run VCR and unit tests
        run: ./mvnw -B -ntp clean test -Dtest="**/vcr/*Test,**/service/*Test,**/controller/*Test" -Dsurefire.failIfNoSpecifiedTests=false
        env:
          SPRING_PROFILES_ACTIVE: ci
          DOCKER_HOST: unix:///var/run/docker.sock

  verify-coverage:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Verify with coverage (VCR + unit tests, min 80%)
        run: ./mvnw -B -ntp clean verify -Dtest="**/vcr/*Test,**/service/*Test,**/controller/*Test" -Dsurefire.failIfNoSpecifiedTests=false
        env:
          SPRING_PROFILES_ACTIVE: ci
          DOCKER_HOST: unix:///var/run/docker.sock

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: biblioteca-pessoal-jar
          path: target/*.jar
