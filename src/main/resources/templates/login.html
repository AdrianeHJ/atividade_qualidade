<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Biblioteca Pessoal</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page">
<div class="auth-card">
    <h1>📚 Biblioteca Pessoal</h1>
    <h2>Entrar</h2>

    <div th:if="${param.logout}" class="alert alert-success">Você saiu com sucesso.</div>
    <div th:if="${param.error}" class="alert alert-error">E-mail ou senha incorretos.</div>
    <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="username">E-mail</label>
            <input type="email" id="username" name="username" required placeholder="seu@email.com">
        </div>
        <div class="form-group">
            <label for="password">Senha</label>
            <input type="password" id="password" name="password" required placeholder="Sua senha">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Entrar</button>
    </form>
    <p class="auth-link">Não tem conta? <a th:href="@{/registro}">Cadastre-se</a></p>
</div>
</body>
</html>
